<script>
/* ============ KATEGORI & SENI GENERATIF ============ */
const CATS={imggen:{label:'Penghasil Gambar',code:'IMG'},nlp:{label:'NLP & Chatbot',code:'NLP'},audio:{label:'Audio & Suara',code:'AUD'},video:{label:'Video & Motion',code:'VID'},vision:{label:'Computer Vision',code:'VIS'},coding:{label:'Asisten Kode',code:'DEV'},agent:{label:'Otomasi & Agen',code:'AGT'},data:{label:'Data & Dataset',code:'DAT'},llm:{label:'LLM Lokal',code:'LLM'}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons=()=>window.lucide&&lucide.createIcons();
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PALS=[{a:'#c8f04f',b:'#e9efe4'},{a:'#ff7847',b:'#f5d547'},{a:'#5ee0c2',b:'#e9efe4'},{a:'#f5d547',b:'#c8f04f'},{a:'#e9efe4',b:'#5ee0c2'},{a:'#ff7847',b:'#e9efe4'}];
  const PAT={
 imggen(c,R,w,h,C){const n=Math.max(4,Math.round(h/34)),cw=w/n,ch=h/n;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const r=R();
   if(r<.1){c.fillStyle=C.a;c.globalAlpha=.95;c.fillRect(x*cw+1,y*ch+1,cw-2,ch-2)}
   else if(r<.24){c.fillStyle=C.b;c.globalAlpha=.15;c.fillRect(x*cw+1,y*ch+1,cw-2,ch-2)}
   else if(r<.29){c.strokeStyle=C.a;c.globalAlpha=.7;c.beginPath();c.arc(x*cw+cw/2,y*ch+ch/2,Math.min(cw,ch)/2.6,0,7);c.stroke()}
   c.globalAlpha=1}},
 llm(c,R,w,h,C){const s=Math.max(13,Math.round(h/9));
  for(let y=0;y<Math.ceil(h/s);y++)for(let x=0;x<Math.ceil(w/s);x++){const r=R();
   c.fillStyle=r<.1?C.a:C.b;c.globalAlpha=r<.1?.8:r<.3?.28:.08;c.fillRect(x*s+1,y*s+1,s-3,s-3)}c.globalAlpha=1},
 nlp(c,R,w,h,C){for(let y=10;y<h-8;y+=17){let x=10+R()*22;
  while(x<w-20){const len=8+R()*46;c.fillStyle=R()<.2?C.a:C.b;c.globalAlpha=R()<.2?.8:.3;
   c.fillRect(x,y,len,Math.max(3,h*.028));x+=len+7}c.globalAlpha=1}},
 audio(c,R,w,h,C){const n=Math.max(24,Math.floor(w/11)),bw=w/n;
  for(let i=0;i<n;i++){const amp=(.22+R()*.78)*(h*.42),hl=R()<.15;
   c.fillStyle=hl?C.a:C.b;c.globalAlpha=hl?.9:.34;c.fillRect(i*bw+1,h/2-amp/2,Math.max(1,bw-2),amp)}c.globalAlpha=1},
 vision(c,R,w,h,C){const cx=w*.5,cy=h*.5,mr=Math.min(w,h)*.42;
  for(let i=1;i<=4;i++){c.strokeStyle=C.b;c.globalAlpha=.22;c.beginPath();c.arc(cx,cy,mr*i/4,0,7);c.stroke()}
  c.globalAlpha=1;c.strokeStyle=C.a;c.lineWidth=2;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+mr*.7,cy-mr*.5);c.stroke();
  const b=Math.min(w,h)*.18;c.strokeStyle=C.b;
  [[8,8,1,1],[w-8,8,-1,1],[8,h-8,1,-1],[w-8,h-8,-1,-1]].forEach(([x,y,sx,sy])=>{c.beginPath();c.moveTo(x+sx*b,y);c.lineTo(x,y);c.lineTo(x,y+sy*b);c.stroke()});
  c.fillStyle=C.a;for(let i=0;i<3;i++){const a=R()*7,d=R()*mr*.85;c.beginPath();c.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d,2.5,0,7);c.fill()}c.lineWidth=1},
 video(c,R,w,h,C){const fh=h*.6,fy=(h-fh)/2,fw=fh*.78;
  c.fillStyle='rgba(233,239,228,.05)';c.fillRect(0,fy,w,fh);
  for(let x=6;x<w;x+=fw+10){c.strokeStyle=C.b;c.globalAlpha=.5;c.strokeRect(x,fy,fw,fh);
   if(R()<.5){c.fillStyle=C.a;c.globalAlpha=.85;c.beginPath();c.moveTo(x+fw/2-6,fy+fh/2-7);c.lineTo(x+fw/2-6,fy+fh/2+7);c.lineTo(x+fw/2+7,fy+fh/2);c.closePath();c.fill()}
   c.fillStyle=C.a;c.globalAlpha=.5;for(let hx=x+7;hx<x+fw-4;hx+=15){c.fillRect(hx,fy-9,6,5);c.fillRect(hx,fy+fh+4,6,5)}c.globalAlpha=1}
  c.fillStyle=C.a;c.fillRect(0,h-12,w*.4,4)},
 coding(c,R,w,h,C){const lines=Math.floor(h/22);
  for(let i=0;i<lines;i++){const y=13+i*22,ind=(R()*4|0)*16+12,segs=1+(R()*3|0);let x=ind;
   for(let s=0;s<segs;s++){const len=18+R()*80;c.fillStyle=(s===0&&R()<.5)?C.a:C.b;c.globalAlpha=s===0?.85:.36;c.fillRect(x,y,len,6);x+=len+13}c.globalAlpha=1}
  c.fillStyle=C.a;c.fillRect(0,h*.45,w,2);
  c.font=`700 ${h*.3}px "JetBrains Mono"`;c.fillStyle=C.a;c.globalAlpha=.75;c.textAlign='right';c.fillText('</>',w-10,h*.58);c.textAlign='left';c.globalAlpha=1},
 agent(c,R,w,h,C){const nodes=[];for(let i=0,n=5+(R()*3|0);i<n;i++)nodes.push({x:22+R()*(w-44),y:18+R()*(h-36),r:4+R()*5});
  nodes.forEach((a,i)=>{const b=nodes[(i+1)%nodes.length];c.strokeStyle='rgba(233,239,228,.22)';c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()});
  nodes.forEach(nd=>{c.fillStyle=R()<.45?C.a:C.b;c.globalAlpha=.9;c.beginPath();c.arc(nd.x,nd.y,nd.r,0,7);c.fill();
   c.strokeStyle=C.b;c.globalAlpha=.55;c.beginPath();c.arc(nd.x,nd.y,nd.r+5,0,7);c.stroke();c.globalAlpha=1})},
 data(c,R,w,h,C){const cw=Math.max(30,w/12|0),ch=Math.max(18,h/7|0);
  for(let y=0;y<Math.ceil(h/ch);y++)for(let x=0;x<Math.ceil(w/cw);x++){const r=R();
   c.strokeStyle='rgba(233,239,228,.09)';c.strokeRect(x*cw,y*ch,cw,ch);
   if(r<.18){c.fillStyle=C.a;c.globalAlpha=.8;c.fillRect(x*cw+4,y*ch+5,cw-8,ch-10)}
   else if(r<.34){c.fillStyle=C.b;c.globalAlpha=.22;c.fillRect(x*cw+4,y*ch+5,cw-8,ch-10)}c.globalAlpha=1}
  c.fillStyle='rgba(233,239,228,.06)';c.fillRect(0,0,w,ch);c.fillStyle=C.a;c.fillRect(0,ch-2,w,2)}
};
  function drawArt(cv,tool,t){
  if(!cv)return;
  const c=cv.getContext('2d'),w=cv.width,h=cv.height;
  const seed=hashSeed(String(tool.name)),R=mulberry32(seed),C=PALS[seed%PALS.length];
  c.fillStyle=`hsl(${100+seed%150} 12% ${4+seed%3}%)`;c.fillRect(0,0,w,h);
  c.textAlign='left';c.textBaseline='alphabetic';
  if(h>=90){c.font=`700 ${h*.88}px "Space Grotesk"`;c.fillStyle='rgba(233,239,228,.055)';c.textAlign='right';c.fillText((tool.name||'#')[0].toUpperCase(),w-6,h-6);c.textAlign='left'}
  (PAT[tool.cat]||PAT.llm)(c,R,w,h,C);
  if(t){c.fillStyle=C.a;c.globalAlpha=.85;c.fillRect((t*90)%w,0,2,h);c.globalAlpha=1}
  c.fillStyle='rgba(0,0,0,.15)';for(let y=0;y<h;y+=4)c.fillRect(0,y,w,1);
  if(h>=80){c.strokeStyle='rgba(233,239,228,.07)';c.strokeRect(.5,.5,w-1,h-1);
    c.font=`600 ${Math.max(9,h*.042)}px "JetBrains Mono"`;c.fillStyle='rgba(233,239,228,.42)';
    c.fillText(`${(CATS[tool.cat]||{code:'AI'}).code}-${String(seed%97).padStart(2,'0')} · v${tool.ver||'1.0.0'}`,8,h-9)}
}
/* ============ STATE & API ============ */
let TOOLS=[],WISH=new Set(),LIB=[],CART=[];
let F={q:'',cat:'all',sort:'pop'},view='store',libTab='owned',STATS=null;
try{CART=JSON.parse(localStorage.getItem('forge_cart')||'[]')}catch(e){}
const saveCart=()=>localStorage.setItem('forge_cart',JSON.stringify(CART));
const fmtRp=n=>n?'Rp '+n.toLocaleString('id-ID'):'Gratis';
const fmtDl=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' jt':n>=1e3?(n/1e3).toFixed(0)+' rb':String(n);
const fmtDate=iso=>new Date(iso).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const byId=id=>TOOLS.find(t=>t.id===+id)||LIB.find(t=>t.id===+id);
async function jget(u){const r=await fetch(u);const j=await r.json();if(!r.ok)throw j.error;return j}
async function jpost(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});const j=await r.json();if(!r.ok)throw j.error;return j}
async function loadAll(){
  [TOOLS,WISH,LIB,STATS]=[await jget('/api/tools'),await jget('/api/wishlist'),await jget('/api/library'),await jget('/api/stats')];
  WISH=new Set(WISH);renderAll();
}
  /* ============ TOAST & MODAL ============ */
function toast(msg,icon='check'){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<i data-lucide="${icon}"></i><span>${msg}</span>`;
  $('#toasts').append(t);icons();
  setTimeout(()=>{t.style.opacity=0;t.style.transition='.3s';setTimeout(()=>t.remove(),320)},3400);
}
function modal(html){const root=$('#modal-root');
  root.innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`;
  root.firstElementChild.addEventListener('pointerdown',e=>{if(e.target===root.firstElementChild)closeModal()});
  document.body.classList.add('lock');icons();return root.querySelector('.modal')}
function closeModal(){$('#modal-root').innerHTML='';if(!$('#drawer-wrap').classList.contains('open'))document.body.classList.remove('lock')}
/* ============ RENDER ============ */
function starsHTML(t){
  if(!t.ratingCount&&!t.rating)return '<span class="norat mono">belum diulas</span>';
  const f=Math.round(t.rating);
  return `<span class="stars">${[0,1,2,3,4].map(i=>`<i data-lucide="star" class="${i<f?'on':''}"></i>`).join('')}</span> <b class="rv mono">${t.rating.toFixed(1).replace('.',',')}</b><span class="rc mono">(${t.ratingCount})</span>`;
}
function priceHTML(t){
  if(t.price===0)return '<span class="price free">Gratis</span>';
  if(t.disc)return `<span class="price"><span class="p-old">${fmtRp(t.price)}</span>${fmtRp(Math.round(t.price*(100-t.disc)/100/500)*500)}</span>`;
  return `<span class="price">${fmtRp(t.price)}</span>`;
}
function platIcons(t){return t.plat.map(p=>`<i data-lucide="${p==='windows'?'monitor':'smartphone'}" title="${p}"></i>`).join('')}
function licChip(t){const o=['MIT','Apache-2.0','GPL-3.0','MPL-2.0','CC-BY-4.0'].includes(t.lic);return `<span class="chip ${o?'oss':'indie'}">${o?'Open Source':'Indie'} · ${t.lic}</span>`}
function cardHTML(t,wide){
  return `<article class="app-card${wide?' wide':''}" data-id="${t.id}" data-act="open" tabindex="0">
   <div class="cover"><canvas data-id="${t.id}" width="${wide?760:520}" height="${wide?300:242}"></canvas>
    <div class="badges">${t.disc?`<span class="badge sale">−${t.disc}%</span>`:''}${t.price===0?'<span class="badge free2">GRATIS</span>':''}${t.hasFile?'<span class="badge new">BERKAS NYATA</span>':''}</div>
    <button class="quick ${WISH.has(t.id)?'on':''}" data-act="wish" data-id="${t.id}" title="Wishlist"><i data-lucide="heart"></i></button></div>
   <div class="cinfo">
    <div class="c-top"><span class="cat-chip">${(CATS[t.cat]||{}).label||''}</span><span class="plats">${platIcons(t)}</span></div>
    <h3>${esc(t.name)}</h3><p class="tl">${esc(t.tagline)}</p>
    <div class="c-rate">${starsHTML(t)}</div>
    <div class="c-bot"><span class="dl mono"><i data-lucide="download"></i>${fmtDl(t.downloads)}</span>${priceHTML(t)}</div>
   </div></article>`;
}
  function renderGrid(){
  let list=TOOLS.filter(t=>{
    if(F.cat!=='all'&&t.cat!==F.cat)return false;
    if(F.q&&!(t.name+' '+t.tagline+' '+t.dev+' '+t.tags.join(' ')).toLowerCase().includes(F.q.toLowerCase()))return false;
    return true});
  list.sort((a,b)=>F.sort==='pop'?b.downloads-a.downloads:F.sort==='rate'?b.rating-a.rating:F.sort==='new'?new Date(b.createdAt)-new Date(a.createdAt):F.sort==='asc'?(a.price||0)-(b.price||0):F.sort==='desc'?(b.price||0)-(a.price||0):a.name.localeCompare(b.name));
  $('#grid').innerHTML=list.length?list.map((t,i)=>cardHTML(t,i%7===3&&list.length>4)).join(''):
   `<div class="g-empty"><i data-lucide="package-search"></i><h4>Tidak ada tool yang cocok</h4><p>Reset pencarianmu atau unggah tool baru.</p></div>`;
  $$('#grid canvas[data-id]').forEach(cv=>drawArt(cv,byId(cv.dataset.id)));
  $('#resCount').textContent=list.length+' dari '+TOOLS.length+' tools';
  renderCats();icons();
}
function renderCats(){
  $('#catsRow').innerHTML=['all',...Object.keys(CATS)].map(k=>{
    const n=k==='all'?TOOLS.length:TOOLS.filter(t=>t.cat===k).length;
    const lbl=k==='all'?'Semua':CATS[k].label;
    return `<button class="cchip ${F.cat===k?'on':''}" data-act="cat" data-cat="${k}">${lbl} <span class="mono">${n}</span></button>`}).join('');
}
function renderBadges(){
  const set=(el,n)=>{el.hidden=!n;el.textContent=n};
  set($('#cartN'),CART.length);set($('#wishN'),WISH.size);
  const n=$('#navLibN');n.hidden=!LIB.length;n.textContent=LIB.length;
}
function renderStatsBar(){
  if(!STATS)return;
  $('#nbHost').textContent='host: '+STATS.host;
  $('#nbStats').innerHTML=`${STATS.tools} tools · ${STATS.reviews} ulasan · ${STATS.purchases} pembelian · ${STATS.users} pengunjung — semuanya di Neon`;
}
function renderAll(){renderGrid();renderBadges();renderStatsBar();if(view==='library')renderLibrary()}
  /* ============ LIBRARY ============ */
function renderLibrary(){
  $('#libTabs').innerHTML=`<button class="ltab ${libTab==='owned'?'on':''}" data-act="lib-tab" data-tab="owned">Dimiliki <b class="mono">${LIB.length}</b></button>
   <button class="ltab ${libTab==='wish'?'on':''}" data-act="lib-tab" data-tab="wish">Wishlist <b class="mono">${WISH.size}</b></button>`;
  const box=$('#libList');
  if(libTab==='owned'){
    if(!LIB.length){box.innerHTML=`<div class="g-empty"><i data-lucide="package"></i><h4>Pustakamu masih kosong</h4><p>Ambil tools gratis atau beli tools indie — catatannya tersimpan permanen di Neon.</p><button class="btn" data-act="view" data-view="store">Jelajahi etalase</button></div>`;icons();return}
    box.innerHTML=LIB.map(t=>`<div class="lib-row">
      <div class="lr-cover"><canvas data-id="${t.id}" width="320" height="180"></canvas></div>
      <div class="lr-info"><h3>${esc(t.name)} <span class="mono v">v${t.ver}</span></h3>
        <div class="lr-meta mono">${(CATS[t.cat]||{}).label} · order ${t.orderId} · ${fmtRp(t.pricePaid)} · ${fmtDate(t.bought)}</div>
        <div class="c-rate">${starsHTML(t)}</div></div>
      <div class="lr-act">${t.hasFile
        ?`<a class="btn-acc" href="/api/download/${t.id}"><i data-lucide="download"></i>Unduh berkas</a>`
        :`<button class="btn" data-act="dl-x"><i data-lucide="info"></i>Berkas contoh</button>`}
        ${t.releaseUrl?`<a class="btn" href="${esc(t.releaseUrl)}" target="_blank" rel="noopener"><i data-lucide="external-link"></i>Halaman rilis</a>`:''}</div>
    </div>`).join('');
  }else{
    const items=TOOLS.filter(t=>WISH.has(t.id));
    if(!items.length){box.innerHTML=`<div class="g-empty"><i data-lucide="heart"></i><h4>Belum ada tool di wishlist</h4><p>Tandai tool dengan ikon hati — tersimpan permanen di Neon.</p></div>`;icons();return}
    box.innerHTML=items.map(t=>`<div class="lib-row">
      <div class="lr-cover"><canvas data-id="${t.id}" width="320" height="180"></canvas></div>
      <div class="lr-info"><h3>${esc(t.name)}</h3><div class="lr-meta mono">${(CATS[t.cat]||{}).label} · ${t.plat.join(' · ')}</div><div class="c-rate">${starsHTML(t)}</div></div>
      <div class="lr-act">${t.price===0?`<button class="btn-acc" data-act="get" data-id="${t.id}">Dapatkan</button>`:`<button class="btn" data-act="cart-add" data-id="${t.id}"><i data-lucide="shopping-cart"></i>Keranjang</button>`}</div>
    </div>`).join('');
  }
  $$('#libList canvas[data-id]').forEach(cv=>drawArt(cv,byId(cv.dataset.id)));icons();
}
/* ============ KERANJANG & CHECKOUT ============ */
function openCart(){$('#drawer-wrap').classList.add('open');document.body.classList.add('lock');renderCart()}
function closeCart(){$('#drawer-wrap').classList.remove('open');if(!$('#modal-root').innerHTML)document.body.classList.remove('lock')}
function renderCart(){
  const items=CART.map(byId).filter(Boolean),body=$('#cartBody'),foot=$('#cartFoot');
  if(!items.length){body.innerHTML=`<div style="text-align:center;padding:60px 10px;color:var(--muted)"><i data-lucide="shopping-cart" style="width:32px;height:32px;color:var(--dim)"></i><p style="margin-top:10px">Keranjangmu kosong.</p></div>`;foot.innerHTML='';icons();return}
  body.innerHTML=items.map(t=>`<div class="ci">

function setFile(f){

  icons();upSync();
}

/* ambient glyphs di bar status */
(function(){
  const cv=$('#glyphs'),bar=$('.neonbar'),ctx=cv.getContext('2d');
  const G='01<>[]{}#%&*+=/|ΛΔ'.split('');
  let W,H,items=[];
  function size(){W=cv.width=bar.clientWidth;H=cv.height=bar.clientHeight;
    items=Array.from({length:Math.min(60,Math.floor(W*H/9000))},()=>({x:Math.random()*W,y:Math.random()*H,v:.1+Math.random()*.3,c:G[Math.random()*G.length|0],s:9+Math.random()*11,a:.05+Math.random()*.12,acc:Math.random()<.08}))}
  (function loop(){
    if(document.visibilityState==='visible'){
      ctx.clearRect(0,0,W,H);
      for(const it of items){it.y-=it.v;if(it.y<-20){it.y=H+20;it.x=Math.random()*W}
       ctx.font=`600 ${it.s}px "JetBrains Mono"`;
       ctx.fillStyle=it.acc?`rgba(200,240,79,${it.a})`:`rgba(147,160,148,${it.a})`;
       ctx.fillText(it.c,it.x,it.y)}}
    requestAnimationFrame(loop)})();
  window.addEventListener('resize',size);size();
})();
